<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <base target="_top">
  <!-- Vital for mobile rendering and scaling -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ABBS Admin Portal</title>

  <!-- Replaced Apps Script include with standard CSS link -->
  <link rel="stylesheet" href="adminStyles.css">
</head>

<body>

<!-- Mobile Header & Toggle -->
<div class="mobile-header">
  <span class="mobile-title">ABBS SIS</span>
  <button class="menu-toggle" onclick="toggleMenu()">☰ Menu</button>
</div>

<div class="wrapper">

    <!-- Sidebar / Mobile Navigation -->
    <div class="sidebar" id="sidebar">

        <h2>ABBS SIS</h2>

        <ul>
            <li onclick="loadPage('dashboard'); closeMenu()">🏠 Dashboard</li>
            <li onclick="loadPage('students'); closeMenu()">👨‍🎓 Students</li>
            <li onclick="loadPage('academicSessions'); closeMenu()">🗓 Academic Sessions</li>
            <li onclick="loadPage('programmes'); closeMenu()">📚 Programmes</li>
            <li onclick="loadPage('courses'); closeMenu()">📖 Courses</li>
            <li onclick="loadPage('enrolments'); closeMenu()">📝 Enrolments</li>
            <li onclick="loadPage('assessments'); closeMenu()">📊 Assessments</li>
            <li onclick="loadPage('certificates'); closeMenu()">🎓 Certificates</li>
            <li onclick="loadPage('reports'); closeMenu()">📈 Reports</li>
            <li onclick="loadPage('settings'); closeMenu()">⚙️ Settings</li>
        </ul>

    </div>

    <!-- Main Content -->
    <div class="content">

        <div id="mainContent">
            <!-- Dynamic page content loads here -->
            <p>Loading...</p>
        </div>

    </div>

</div>

<script>
  function toggleMenu() {
    var sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('open');
  }

  function closeMenu() {
    var sidebar = document.getElementById('sidebar');
    if (window.innerWidth <= 768) {
      sidebar.classList.remove('open');
    }
  }

  // Dynamic page loader replacing Apps Script HTML includes
  async function loadPage(pageName) {
    const mainContent = document.getElementById('mainContent');
    
    // Capitalize first letter to match Dashboard.html naming
    const fileName = pageName.charAt(0).toUpperCase() + pageName.slice(1) + '.html';

    try {
      const response = await fetch(fileName);
      if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
      const html = await response.text();
      mainContent.innerHTML = html;

      // Automatically trigger metric fetch if loading the Dashboard view
      if (pageName === 'dashboard' && typeof fetchDashboardMetrics === 'function') {
        fetchDashboardMetrics();
      }
    } catch (error) {
      mainContent.innerHTML = `<h3>Error loading page: ${pageName}</h3><p>Make sure ${fileName} exists in your repository.</p>`;
      console.error('Page load error:', error);
    }
  }

  // Load dashboard view by default when DOM loads
  window.addEventListener('DOMContentLoaded', () => {
    loadPage('dashboard');
  });
</script>

<!-- Replaced Apps Script include with standard JS script tag -->
<script src="adminScripts.js"></script>

</body>

</html>
